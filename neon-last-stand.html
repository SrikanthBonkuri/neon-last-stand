<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1127"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./neon-last-stand-icon.svg"><title>Neon Last Stand</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle,#202655,#080a18 65%);font-family:system-ui,sans-serif;color:#fff}main{position:relative;width:min(96vw,960px)}canvas{display:block;width:100%;aspect-ratio:3/2;border:2px solid #6ce8ff;border-radius:14px;box-shadow:0 0 34px #137ab7;background:#10142c;cursor:crosshair}.panel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,7,19,.65);border-radius:14px;text-align:center}.card{max-width:530px;padding:26px}.card h1{margin:0;color:#7eecff;letter-spacing:.12em;font-size:clamp(2.3rem,7vw,4.5rem);text-shadow:0 0 24px #149cf1}.card p{line-height:1.5;color:#d5ddf8}.card button{margin:5px;padding:12px 18px;border:1px solid #72eaff;border-radius:9px;background:#172343;color:#fff;font-weight:700;font-size:1rem;cursor:pointer}.card button:hover{background:#284b79}.card .primary{background:#ffca48;color:#141727;border:0}.hidden{display:none}.hint{text-align:center;color:#cbd5f0;font-size:.9rem;margin-top:10px}kbd{padding:1px 6px;background:#1a2340;border:1px solid #8493ba;border-radius:4px}
</style></head><body><main><canvas id="game" width="960" height="640"></canvas><div id="overlay" class="panel"><div id="card" class="card"></div></div><div class="hint"><kbd>WASD</kbd> move &nbsp; <kbd>Mouse</kbd> aim &nbsp; <kbd>Click / hold</kbd> shoot</div></main><script>
const c=document.querySelector('#game'),g=c.getContext('2d'),overlay=document.querySelector('#overlay'),card=document.querySelector('#card'),W=c.width,H=c.height;let keys={},mouse={x:W/2,y:H/2,down:false},state='menu',player,enemies,bullets,gems,particles,score,wave,waveClock,spawnClock,high=+localStorage.getItem('neonLastHigh')||0,last=0,upgrades=[];const stars=Array.from({length:130},()=>({x:Math.random()*W,y:Math.random()*H,size:Math.random()*2+.4,a:Math.random()*.65+.2,hue:Math.random()<.12?190:Math.random()<.1?295:0}));
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape'&&state==='running')state='menu'});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect();mouse.x=(e.clientX-r.left)*W/r.width;mouse.y=(e.clientY-r.top)*H/r.height});c.addEventListener('mousedown',()=>mouse.down=true);addEventListener('mouseup',()=>mouse.down=false);
const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),wrap=(n,m)=>((n%m)+m)%m;function reset(){player={x:0,y:0,r:16,hp:100,maxHp:100,level:1,xp:0,next:36,fire:.18,fireClock:0,damage:2,pierce:0,move:163.33,magnet:105,rapid:0,shield:0,inv:0,angle:0};enemies=[];bullets=[];gems=[];particles=[];score=0;wave=1;waveClock=0;spawnClock=.7;state='running';overlay.classList.add('hidden')}
function menu(){state='menu';overlay.classList.remove('hidden');card.innerHTML=`<h1>NEON<br>LAST STAND</h1><p>Survive the swarm. Gather energy crystals, choose upgrades, and chase a new high score.</p><button class="primary" id="go">START RUN</button><p>High score: <b>${high}</b></p>`;document.querySelector('#go').onclick=reset}menu();
function enemy(){let a=Math.random()*Math.PI*2,d=rnd(430,570),type=Math.random()<Math.min(.25,wave*.018)?'brute':Math.random()<.18?'skitter':'drone',data=type==='brute'?{r:24,hp:14,spd:28,col:'#845968',value:5}:type==='skitter'?{r:11,hp:2,spd:76.67,col:'#a08b63',value:2}:{r:16,hp:4,spd:45.33,col:'#697389',value:3};enemies.push({x:player.x+Math.cos(a)*d,y:player.y+Math.sin(a)*d,type,...data,hit:0,spin:rnd(-2.2,2.2),rock:rnd(0,6.28)})}
function shoot(){let p=player,a=p.angle,spread=p.rapid?[-.13,0,.13]:[0];for(let s of spread)bullets.push({x:p.x+Math.cos(a)*22,y:p.y+Math.sin(a)*22,vx:Math.cos(a+s)*610,vy:Math.sin(a+s)*610,life:1.1,dmg:p.damage,pierce:p.pierce});p.fireClock=p.fire/(p.rapid?1.6:1);burst(p.x+Math.cos(a)*20,p.y+Math.sin(a)*20,'#8af4ff',3,90)}
function burst(x,y,col,n=10,force=130){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=rnd(force*.25,force);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.18,.55),max:.55,col,size:rnd(2,5)})}}
function levelUp(){state='upgrade';let pool=[['OVERCHARGE','+1 bullet damage',()=>player.damage++],['QUICK TRIGGER','Fire 22% faster',()=>player.fire*=.78],['MAGNET CORE','Wider crystal pickup',()=>player.magnet+=55],['HULL PLATING','+25 maximum health',()=>{player.maxHp+=25;player.hp+=25}],['PIERCING SHOTS','Bullets pass through +1 enemy',()=>player.pierce++],['THRUSTERS','Move 15% faster',()=>player.move*=1.15],['TRIPLE SHOT','Fire three shots at once',()=>player.rapid=1]];upgrades=[];while(upgrades.length<3){let u=pool.splice(Math.floor(Math.random()*pool.length),1)[0];upgrades.push(u)}overlay.classList.remove('hidden');card.innerHTML=`<h1>LEVEL ${player.level}</h1><p>Choose an upgrade</p>${upgrades.map((u,i)=>`<button class="upgrade" data-i="${i}"><b>${u[0]}</b><br>${u[1]}</button>`).join('')}`;document.querySelectorAll('.upgrade').forEach(b=>b.onclick=()=>{upgrades[+b.dataset.i][2]();state='running';overlay.classList.add('hidden')})}
function update(dt){if(state!=='running')return;let p=player,mx=mouse.x-W/2,my=mouse.y-H/2;p.angle=Math.atan2(my,mx);let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);let l=Math.hypot(dx,dy)||1;p.x+=dx/l*p.move*dt;p.y+=dy/l*p.move*dt;p.fireClock-=dt;p.inv=Math.max(0,p.inv-dt);if(mouse.down&&p.fireClock<=0)shoot();waveClock+=dt;spawnClock-=dt;if(spawnClock<=0){enemy();spawnClock=Math.max(.13,.76-wave*.024)}if(waveClock>24){wave++;waveClock=0;burst(p.x,p.y,'#ffdf54',20,180)}for(let e of enemies){let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.spd*dt;e.y+=Math.sin(a)*e.spd*dt;e.hit=Math.max(0,e.hit-dt);e.rock+=e.spin*dt;if(dist(e,p)<e.r+p.r&&p.inv<=0){p.hp-=e.type==='brute'?18:10;p.inv=.55;burst(p.x,p.y,'#ff5877',18,190)}}for(let b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;for(let e of enemies){if(!e.dead&&Math.hypot(b.x-e.x,b.y-e.y)<e.r+5){e.hp-=b.dmg;e.hit=.12;b.pierce--;burst(b.x,b.y,'#d9fbff',5,110);if(e.hp<=0){e.dead=true;score+=e.value;gems.push({x:e.x,y:e.y,value:e.value});burst(e.x,e.y,e.col,14,160)}if(b.pierce<0)b.life=0;break}}}bullets=bullets.filter(b=>b.life>0);enemies=enemies.filter(e=>!e.dead);for(let gem of gems){let d=dist(gem,p);if(d<p.magnet){gem.x+=(p.x-gem.x)*dt*5;gem.y+=(p.y-gem.y)*dt*5}if(d<22){p.xp+=gem.value;gem.dead=true;burst(gem.x,gem.y,'#69f3ff',6,80)}}gems=gems.filter(q=>!q.dead);if(p.xp>=p.next){p.xp-=p.next;p.level++;p.next=Math.floor(p.next*1.7);levelUp()}for(let q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.92;q.vy*=.92;q.life-=dt}particles=particles.filter(q=>q.life>0);if(p.hp<=0){state='dead';high=Math.max(high,score);localStorage.setItem('neonLastHigh',high);overlay.classList.remove('hidden');card.innerHTML=`<h1>RUN OVER</h1><p>Score: <b>${score}</b> &nbsp;•&nbsp; Wave: <b>${wave}</b><br>High score: ${high}</p><button class="primary" id="go">TRY AGAIN</button>`;document.querySelector('#go').onclick=reset}}
function world(){return{x:W/2-player.x,y:H/2-player.y}}function circle(x,y,r,col,glow=0){if(glow){g.shadowBlur=glow;g.shadowColor=col}g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,6.28);g.fill();g.shadowBlur=0}function draw(){g.fillStyle='#0d1127';g.fillRect(0,0,W,H);let o=player?world():{x:W/2,y:H/2};g.strokeStyle='#202856';g.lineWidth=1;for(let i=-800;i<900;i+=50){g.beginPath();g.moveTo(o.x+i,0);g.lineTo(o.x+i,H);g.stroke();g.beginPath();g.moveTo(0,o.y+i);g.lineTo(W,o.y+i);g.stroke()}if(!player)return;for(let q of particles){let a=q.life/q.max;g.globalAlpha=a;circle(q.x+o.x,q.y+o.y,q.size,q.col,q.size*2)}g.globalAlpha=1;for(let gem of gems){circle(gem.x+o.x,gem.y+o.y,7,'#55eaff',14)}for(let b of bullets){circle(b.x+o.x,b.y+o.y,4,'#d8fcff',12)}for(let e of enemies){let ex=e.x+o.x,ey=e.y+o.y;circle(ex,ey,e.r,e.hit?'#fff':e.col,12);g.fillStyle='#181a32';g.fillRect(ex-e.r,ey-e.r-10,e.r*2,4);g.fillStyle='#72f4e9';g.fillRect(ex-e.r,ey-e.r-10,e.r*2*Math.max(0,e.hp/(e.value===5?14:e.value===3?4:2)),4)}let px=W/2,py=H/2;g.save();g.translate(px,py);g.rotate(player.angle);g.fillStyle=player.inv>0?'#fff':'#35c8ff';g.shadowBlur=22;g.shadowColor='#24bcff';g.beginPath();g.moveTo(23,0);g.lineTo(-14,-13);g.lineTo(-7,0);g.lineTo(-14,13);g.closePath();g.fill();g.restore();g.shadowBlur=0;g.fillStyle='rgba(6,9,24,.76)';g.fillRect(14,H-58,255,38);g.fillStyle='#ff5f7c';g.fillRect(20,H-52,160*Math.max(0,player.hp/player.maxHp),10);g.fillStyle='#26314d';g.fillRect(20+160,H-52,0,10);g.fillStyle='#6df3ff';g.fillRect(20,H-35,230*player.xp/player.next,7);g.fillStyle='#fff';g.font='bold 14px system-ui';g.fillText(`HP ${Math.max(0,Math.ceil(player.hp))}/${player.maxHp}     LVL ${player.level}`,20,H-10);g.textAlign='right';g.font='bold 19px system-ui';g.fillStyle='#ffdb59';g.fillText(`SCORE ${score}  •  WAVE ${wave}`,W-18,32);g.textAlign='start'}function loop(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script><script>
draw=function(){g.fillStyle='#0d1127';g.fillRect(0,0,W,H);if(!player)return;for(const s of stars){let sx=wrap(s.x-player.x*.055,W),sy=wrap(s.y-player.y*.055,H);g.globalAlpha=s.a;circle(sx,sy,s.size,s.hue?`hsl(${s.hue} 90% 78%)`:'#c9ddff',s.size>1.7?5:0)}g.globalAlpha=1;let neb=g.createRadialGradient(W*.16,H*.18,0,W*.16,H*.18,240);neb.addColorStop(0,'rgba(113,49,180,.15)');neb.addColorStop(1,'rgba(113,49,180,0)');g.fillStyle=neb;g.fillRect(0,0,W,H);neb=g.createRadialGradient(W*.84,H*.82,0,W*.84,H*.82,280);neb.addColorStop(0,'rgba(24,149,193,.13)');neb.addColorStop(1,'rgba(24,149,193,0)');g.fillStyle=neb;g.fillRect(0,0,W,H);let o=world();g.strokeStyle='#202856';g.lineWidth=1;for(let i=-800;i<900;i+=50){g.beginPath();g.moveTo(o.x+i,0);g.lineTo(o.x+i,H);g.stroke();g.beginPath();g.moveTo(0,o.y+i);g.lineTo(W,o.y+i);g.stroke()}for(let q of particles){g.globalAlpha=q.life/q.max;circle(q.x+o.x,q.y+o.y,q.size,q.col,q.size*2)}g.globalAlpha=1;for(let gem of gems)circle(gem.x+o.x,gem.y+o.y,7,'#55eaff',14);for(let b of bullets)circle(b.x+o.x,b.y+o.y,4,'#d8fcff',12);for(let e of enemies){let ex=e.x+o.x,ey=e.y+o.y;g.save();g.translate(ex,ey);g.rotate(e.rock);g.fillStyle=e.hit?'#fff':e.col;g.shadowBlur=15;g.shadowColor=e.col;g.beginPath();for(let i=0;i<9;i++){let a=i*6.283/9,r=e.r*(.78+.17*Math.sin(i*4+e.spin));i?g.lineTo(Math.cos(a)*r,Math.sin(a)*r):g.moveTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.shadowBlur=0;g.strokeStyle='#283044';g.lineWidth=2;g.stroke();g.fillStyle='rgba(23,27,41,.55)';g.beginPath();g.arc(-e.r*.22,-e.r*.12,e.r*.22,0,6.28);g.fill();g.beginPath();g.arc(e.r*.27,e.r*.25,e.r*.15,0,6.28);g.fill();g.restore();g.fillStyle='#181a32';g.fillRect(ex-e.r,ey-e.r-10,e.r*2,4);g.fillStyle='#72f4e9';g.fillRect(ex-e.r,ey-e.r-10,e.r*2*Math.max(0,e.hp/(e.value===5?14:e.value===3?4:2)),4)}let px=W/2,py=H/2;g.save();g.translate(px,py);g.rotate(player.angle);g.shadowBlur=18;g.shadowColor='#25c8ff';g.fillStyle=player.inv>0?'#fff':'#2cbdf4';g.fillRect(-9,-11,19,25);g.fillStyle='#192641';g.fillRect(-7,12,6,12);g.fillRect(4,12,6,12);g.fillStyle='#f2c39d';g.beginPath();g.arc(0,-18,9,0,6.28);g.fill();g.fillStyle='#1a2138';g.fillRect(-9,-26,18,6);g.fillStyle='#a4f6ff';g.fillRect(7,-7,23,6);g.fillStyle='#50627c';g.fillRect(24,-5,8,3);g.restore();g.shadowBlur=0;g.fillStyle='rgba(6,9,24,.76)';g.fillRect(14,H-58,255,38);g.fillStyle='#ff5f7c';g.fillRect(20,H-52,160*Math.max(0,player.hp/player.maxHp),10);g.fillStyle='#6df3ff';g.fillRect(20,H-35,230*player.xp/player.next,7);g.fillStyle='#fff';g.font='bold 14px system-ui';g.fillText(`HP ${Math.max(0,Math.ceil(player.hp))}/${player.maxHp}     LVL ${player.level}`,20,H-10);g.textAlign='right';g.font='bold 19px system-ui';g.fillStyle='#ffdb59';g.fillText(`SCORE ${score}  •  WAVE ${wave}`,W-18,32);g.textAlign='start'};
</script><script>
let soundContext;function unlockSound(){try{soundContext??=new (window.AudioContext||window.webkitAudioContext)();soundContext.resume()}catch{}}addEventListener('keydown',unlockSound,{once:true});c.addEventListener('pointerdown',unlockSound,{once:true});function sfx(kind){if(!soundContext||soundContext.state!=='running')return;let now=soundContext.currentTime,o=soundContext.createOscillator(),v=soundContext.createGain(),cfg={shot:[510,.045,'square',.025,380],pickup:[780,.09,'sine',.045,1120],kill:[190,.11,'triangle',.035,90],hurt:[130,.16,'sawtooth',.05,70],level:[420,.24,'sine',.055,980],dead:[180,.5,'sawtooth',.06,45]}[kind];if(!cfg)return;o.type=cfg[2];o.frequency.setValueAtTime(cfg[0],now);o.frequency.exponentialRampToValueAtTime(cfg[4],now+cfg[1]);v.gain.setValueAtTime(cfg[3],now);v.gain.exponentialRampToValueAtTime(.001,now+cfg[1]);o.connect(v).connect(soundContext.destination);o.start(now);o.stop(now+cfg[1])}const originalShoot=shoot;shoot=function(){originalShoot();sfx('shot')};const originalUpdate=update;update=function(dt){let enemyCount=enemies?.length||0,gemCount=gems?.length||0,hp=player?.hp||0,level=player?.level||0,oldState=state;originalUpdate(dt);if(state==='upgrade'&&oldState==='running')sfx('level');if((enemies?.length||0)<enemyCount)sfx('kill');if((gems?.length||0)<gemCount)sfx('pickup');if(player&&player.hp<hp)sfx('hurt');if(state==='dead'&&oldState!=='dead')sfx('dead')};
</script><script>
levelUp=function(){state='upgrade';const repair=['EMERGENCY REPAIRS','Restore 45 health',()=>player.hp=Math.min(player.maxHp,player.hp+45)],vitality=['VITALITY MODULE','+30 maximum health and heal 30',()=>{player.maxHp+=30;player.hp=Math.min(player.maxHp,player.hp+30)}],pool=[['OVERCHARGE','+1 bullet damage',()=>player.damage++],['QUICK TRIGGER','Fire 22% faster',()=>player.fire*=.78],['MAGNET CORE','Wider crystal pickup',()=>player.magnet+=55],vitality,['PIERCING SHOTS','Bullets pass through +1 enemy',()=>player.pierce++],['THRUSTERS','Move 15% faster',()=>player.move*=1.15],['TRIPLE SHOT','Fire three shots at once',()=>player.rapid=1]];upgrades=player.hp<player.maxHp*.72?[repair]:[];while(upgrades.length<3){let u=pool.splice(Math.floor(Math.random()*pool.length),1)[0];upgrades.push(u)}overlay.classList.remove('hidden');card.innerHTML=`<h1>LEVEL ${player.level}</h1><p>Choose an upgrade</p>${upgrades.map((u,i)=>`<button class="upgrade" data-i="${i}"><b>${u[0]}</b><br>${u[1]}</button>`).join('')}`;document.querySelectorAll('.upgrade').forEach(b=>b.onclick=()=>{upgrades[+b.dataset.i][2]();state='running';overlay.classList.add('hidden')})};
</script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));</script><script>
const desktopUpdate=update,desktopDraw=draw;update=function(dt){desktopUpdate(dt);if(player){player.aimAngle=player.angle;player.angle=0}};draw=function(){desktopDraw();if(!player||state!=='running')return;let a=player.aimAngle??0;g.save();g.translate(W/2,H/2);g.rotate(a);g.shadowBlur=12;g.shadowColor='#25c8ff';g.fillStyle='#d89e79';g.fillRect(4,-4,15,8);g.fillStyle='#a4f6ff';g.fillRect(17,-7,23,10);g.fillStyle='#50627c';g.fillRect(34,-4,9,4);g.restore();g.shadowBlur=0};
</script></body></html>
